name: Workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix dashboard ci --no-audit --no-fund
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard run typecheck
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: python -m pip install -r worker/requirements.txt
      - run: ruff check worker scripts
      - run: pytest
        working-directory: worker
      - run: python main.py --health
        working-directory: worker
      - name: Start local database and apply pending migrations
        run: |
          npm run db:start
          npm run db:migrate
          npm run db:config
      - run: python scripts/configure_scheduler.py
      - run: npm run db:test
      - name: Read-only database health
        run: python main.py --check-database
        working-directory: worker
      - name: Production HTTP regression workflows (Phases 1–6)
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix dashboard run start > /tmp/remote-jobs-dashboard-ci.log 2>&1 &
          dashboard_test_pid=$!
          trap 'kill "$dashboard_test_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          python scripts/smoke_local.py
          python scripts/smoke_phase2.py
          python scripts/smoke_phase3.py
          python scripts/smoke_phase4.py
          python scripts/smoke_phase5.py
          python scripts/smoke_phase6.py
